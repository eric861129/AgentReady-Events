name: Build GHCR and deploy Azure

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable branch, tag, or SHA to build
        required: true
        default: main
        type: string
      deploy:
        description: Deploy the verified digest to Azure
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/eric861129/agentready-events

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify application and locked Evals
        run: |
          npm run verify
          npm run evals:validate

      - name: Resolve immutable build metadata
        id: meta
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_NAME:$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Linux container
        shell: bash
        run: |
          SHA="${{ steps.meta.outputs.sha }}"
          TAG="${{ steps.meta.outputs.tag }}"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker buildx build --platform linux/amd64 --load \
            --build-arg VCS_REF="$SHA" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg VERSION=1.0.0 \
            --tag "$TAG" .
          SMOKE_PORT=$(python3 -c "import socket; s=socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1]); s.close()")
          npm run smoke:container -- --image "$TAG" --port "$SMOKE_PORT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SHA tag and resolve digest
        id: publish
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          docker push "$TAG"
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{.Manifest.Digest}}')
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published image did not resolve to a manifest digest." >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: container-build-${{ steps.meta.outputs.sha }}
          path: evidence/latest/container-smoke.json
          if-no-files-found: error

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify anonymous GHCR access
        id: image
        shell: bash
        run: |
          DIGEST="${{ needs.build.outputs.digest }}"
          echo "image_ref=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE_NAME@$DIGEST" >/dev/null

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Compile Bicep and run restricted what-if
        shell: bash
        run: |
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters @infra/main.parameters.json imageRef="${{ steps.image.outputs.image_ref }}" \
            --no-pretty-print \
            --result-format FullResourcePayloads \
            --output json > "$RUNNER_TEMP/what-if.json"
          WHAT_IF_PATH="$RUNNER_TEMP/what-if.json" node <<'NODE'
          const fs = require("node:fs");
          const document = JSON.parse(fs.readFileSync(process.env.WHAT_IF_PATH, "utf8"));
          const changes = document.properties?.changes ?? document.changes ?? [];
          const allowed = [
            "/providers/Microsoft.App/managedEnvironments/",
            "/providers/Microsoft.App/containerApps/"
          ];
          for (const change of changes) {
            if (change.changeType === "Ignore") continue;
            const id = change.resourceId ?? change.after?.id ?? change.before?.id ?? "";
            if (!allowed.some((fragment) => id.includes(fragment))) {
              throw new Error(`Excluded Azure resource in what-if: ${id || "unknown"}`);
            }
          }
          NODE

      - name: Deploy immutable image
        id: deploy
        shell: bash
        run: |
          SHA="${{ needs.build.outputs.sha }}"
          DEPLOYMENT_NAME="agentready-events-${SHA:0:12}"
          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters @infra/main.parameters.json imageRef="${{ steps.image.outputs.image_ref }}" \
            --output none
          FQDN=$(az deployment group show \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.outputs.fqdn.value -o tsv)
          REVISION=$(az containerapp show \
            --name ca-agentready-events \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.latestRevisionName -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Verify public HTTPS production
        run: |
          npm run smoke:azure -- \
            --url "https://${{ steps.deploy.outputs.fqdn }}" \
            --digest "${{ needs.build.outputs.digest }}"

      - name: Write sanitized deployment evidence
        env:
          DEPLOYMENT_COMMIT: ${{ needs.build.outputs.sha }}
          DEPLOYMENT_IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          DEPLOYMENT_FQDN: ${{ steps.deploy.outputs.fqdn }}
          DEPLOYMENT_URL: https://${{ steps.deploy.outputs.fqdn }}
          DEPLOYMENT_REVISION: ${{ steps.deploy.outputs.revision }}
          DEPLOYMENT_REGION: ${{ vars.AZURE_LOCATION }}
          DEPLOYMENT_WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run evidence:deployment

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: azure-deployment-${{ needs.build.outputs.sha }}
          path: |
            evidence/deployments/${{ needs.build.outputs.sha }}.json
            evidence/latest/azure-smoke.json
          if-no-files-found: error
